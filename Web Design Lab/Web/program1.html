<!DOCTYPE html>
<html>
<head>
    <title>Character Formatting</title>
    <style>
        body {
            background-color: #f7f5ef;
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        h2 {
            color: darkblue;
            text-align: center;
        }

        p {
            font-size: 19px;
            line-height: 32px;
        }

        .formula {
            font-size: 24px;
            text-align: center;
            border: 2px solid gray;
            padding: 15px;
            margin-top: 25px;
        }
    </style>
</head>
<body>

    <h2>Character Formatting Tags</h2>

    <p><b>This text is Bold</b> (using the B tag)</p>
    <p><i>This text is Italic</i> (using the I tag)</p>
    <p><u>This text is Underlined</u> (using the U tag)</p>
    <p>H<sub>2</sub>O is an example of Subscript (using the SUB tag)</p>
    <p>X<sup>2</sup> is an example of Superscript (using the SUP tag)</p>

    <div class="formula">
        <b>Logarithm Rule:</b><br><br>
        log<sub>b</sub> m<sup>p</sup> = p log<sub>b</sub> m
    </div>

</body>
</html>
