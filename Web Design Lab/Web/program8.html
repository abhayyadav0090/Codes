<!DOCTYPE html>
<html>
<head>
    <title>Student Table</title>
    <style>
        body {
            background-color: #f5f5f0;
            font-family: Arial, sans-serif;
        }

        h2 {
            color: darkblue;
            text-align: center;
            margin-top: 30px;
        }

        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
            font-size: 17px;
        }

        th {
            background-color: lightgray;
        }
    </style>
</head>
<body>

    <h2>Student Details</h2>

    <table>
        <tr>
            <th>Roll no.</th>
            <th>Student Name</th>
            <th>Year</th>
            <th>Date of Admission</th>
        </tr>
        <tr>
            <td>6</td>
            <td>Rishi Dhakad</td>
            <td>2nd Year</td>
            <td>16-07-2026</td>
        </tr>
        <tr>
            <td>7</td>
            <td>Abhay Yadav</td>
            <td>2nd Year</td>
            <td>11-07-2026</td>
        </tr>
        <tr>
            <td>10</td>
            <td>Suraj Kumar</td>
            <td>2nd Year</td>
            <td>10-07-2026</td>
        </tr>
    </table>

</body>
</html>
